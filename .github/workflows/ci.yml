name: Portfolio CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Portfolio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

  deploy:
    name: Trigger Production Deployment
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Trigger private deployment workflow
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/popcorns41/portfolio-deploy/actions/workflows/deploy.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"source_ref\":\"$SOURCE_SHA\"}}"